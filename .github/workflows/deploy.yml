name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # เพิ่มไว้เผื่อ Action เวอร์ชั่นเก่ารองรับ Node 22+
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # ใช้ Node 22 ให้เหมือนโปรเจ็คแรก
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build web app
        run: npx expo export -p web
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tuber-tools-266cb
          channelId: live

      - name: Install functions dependencies
        run: npm --prefix functions install

      - name: Deploy Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@latest deploy --only functions --project tuber-tools-266cb --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
