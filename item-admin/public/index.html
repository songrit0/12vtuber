<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Item Admin — Unturned Market</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background:#0f1216; color:#e6e6e6; }
  header { padding:14px 20px; background:#161b22; border-bottom:1px solid #2a2f37; display:flex; justify-content:space-between; align-items:center; }
  h1 { font-size:18px; margin:0; }
  .wrap { max-width:1000px; margin:24px auto; padding:0 16px; }
  .card { background:#161b22; border:1px solid #2a2f37; border-radius:10px; padding:18px; margin-bottom:18px; }
  label { display:block; font-size:13px; color:#9aa4b2; margin:8px 0 4px; }
  input { width:100%; padding:9px 10px; background:#0f1216; border:1px solid #2a2f37; border-radius:7px; color:#e6e6e6; font-size:14px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  button { cursor:pointer; border:none; border-radius:7px; padding:9px 14px; font-size:14px; font-weight:600; }
  .primary { background:#2f81f7; color:#fff; }
  .green { background:#238636; color:#fff; }
  .red { background:#da3633; color:#fff; }
  .ghost { background:#21262d; color:#e6e6e6; border:1px solid #2a2f37; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #2a2f37; }
  th { color:#9aa4b2; font-weight:600; }
  img.thumb { width:42px; height:42px; object-fit:cover; border-radius:6px; background:#0f1216; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; }
  .on { background:#1f3a24; color:#3fb950; } .off { background:#3a1f1f; color:#f85149; }
  .muted { color:#9aa4b2; font-size:13px; }
  .err { color:#f85149; font-size:13px; margin-top:8px; }
  .hidden { display:none; }
  .topbtns { display:flex; gap:8px; }
</style>
</head>
<body>
<header>
  <h1>🎮 Item Admin — Unturned Market</h1>
  <div class="topbtns">
    <span id="connInfo" class="muted"></span>
    <button id="disconnectBtn" class="ghost hidden">ตัดการเชื่อมต่อ</button>
  </div>
</header>

<div class="wrap">
  <!-- Connect -->
  <div id="connectCard" class="card">
    <h3 style="margin-top:0">เชื่อมต่อ MySQL</h3>
    <p class="muted">กรอกข้อมูลฐานข้อมูล (จำทุกช่องยกเว้นรหัสผ่าน — ต้องกรอกใหม่ทุกครั้ง)</p>
    <div class="row">
      <div><label>Host</label><input id="host" value="localhost" /></div>
      <div><label>Port</label><input id="port" value="3306" /></div>
      <div><label>Database</label><input id="database" value="unturned" /></div>
    </div>
    <div class="row">
      <div><label>User</label><input id="user" value="root" /></div>
      <div><label>Table prefix</label><input id="tablePrefix" value="sv_" /></div>
      <div><label>Password</label><input id="password" type="password" placeholder="กรอกทุกครั้ง" /></div>
    </div>
    <div style="margin-top:14px"><button class="primary" onclick="connect()">เชื่อมต่อ</button></div>
    <div id="connErr" class="err"></div>
  </div>

  <!-- Manage -->
  <div id="manageCard" class="card hidden">
    <h3 style="margin-top:0" id="formTitle">เพิ่มรายการ</h3>
    <div class="row">
      <div><label>Item ID</label><input id="f_item_id" type="number" /></div>
      <div><label>ชื่อ / Name</label><input id="f_name" /></div>
      <div><label>ราคา / Price</label><input id="f_price" type="number" value="0" /></div>
      <div><label>สต็อก / Amount (0=ซ่อน)</label><input id="f_amount" type="number" value="0" /></div>
    </div>
    <div class="row">
      <div style="grid-column:1/-1"><label>ลิงก์รูป / Image URL</label><input id="f_image" placeholder="https://..." /></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px">
      <input id="f_enabled" type="checkbox" checked style="width:auto" /> เปิดใช้งาน (enabled)
    </label>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="green" onclick="saveItem()">บันทึก</button>
      <button class="ghost" onclick="resetForm()">ล้างฟอร์ม</button>
    </div>
    <div id="saveErr" class="err"></div>
  </div>

  <div id="listCard" class="card hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">รายการทั้งหมด</h3>
      <button class="ghost" onclick="loadItems()">รีเฟรช</button>
    </div>
    <table>
      <thead><tr><th>รูป</th><th>ID</th><th>ชื่อ</th><th>ราคา</th><th>สต็อก</th><th>สถานะ</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="emptyMsg" class="muted hidden">ยังไม่มีรายการ — เพิ่มด้านบน</p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const CONN_KEY = "tubertools_conn";

// prefill connection fields (except password) from localStorage
(function () {
  try {
    const c = JSON.parse(localStorage.getItem(CONN_KEY) || "{}");
    for (const k of ["host", "port", "database", "user", "tablePrefix"]) if (c[k]) $(k).value = c[k];
  } catch (e) {}
})();

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

async function connect() {
  $("connErr").textContent = "";
  const body = {
    host: $("host").value.trim(), port: $("port").value.trim(),
    database: $("database").value.trim(), user: $("user").value.trim(),
    tablePrefix: $("tablePrefix").value.trim(), password: $("password").value,
  };
  try {
    const r = await api("/api/connect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    // save everything EXCEPT password
    localStorage.setItem(CONN_KEY, JSON.stringify({
      host: body.host, port: body.port, database: body.database, user: body.user, tablePrefix: body.tablePrefix,
    }));
    $("connInfo").textContent = `${r.user}@${r.database} (${r.prefix}market)`;
    $("connectCard").classList.add("hidden");
    $("manageCard").classList.remove("hidden");
    $("listCard").classList.remove("hidden");
    $("disconnectBtn").classList.remove("hidden");
    loadItems();
  } catch (e) {
    $("connErr").textContent = "เชื่อมต่อไม่สำเร็จ: " + e.message;
  }
}

async function disconnect() {
  await api("/api/disconnect", { method: "POST" }).catch(() => {});
  location.reload();
}
$("disconnectBtn").onclick = disconnect;

async function loadItems() {
  const rows = await api("/api/items").catch((e) => { alert(e.message); return []; });
  const tb = $("rows"); tb.innerHTML = "";
  $("emptyMsg").classList.toggle("hidden", rows.length > 0);
  for (const it of rows) {
    const tr = document.createElement("tr");
    const img = it.image_url ? `<img class="thumb" src="${it.image_url}" onerror="this.style.opacity=.2">` : `<div class="thumb"></div>`;
    const status = it.enabled ? `<span class="pill on">on</span>` : `<span class="pill off">off</span>`;
    tr.innerHTML = `<td>${img}</td><td>${it.item_id}</td><td>${esc(it.name)}</td>
      <td>${Math.round(it.price)}</td><td>${it.amount}</td><td>${status}</td>
      <td style="white-space:nowrap">
        <button class="ghost" onclick='editItem(${JSON.stringify(it)})'>แก้ไข</button>
        <button class="red" onclick="delItem(${it.item_id})">ลบ</button>
      </td>`;
    tb.appendChild(tr);
  }
}

function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function editItem(it) {
  $("formTitle").textContent = "แก้ไขรายการ #" + it.item_id;
  $("f_item_id").value = it.item_id; $("f_name").value = it.name;
  $("f_price").value = Math.round(it.price); $("f_amount").value = it.amount;
  $("f_image").value = it.image_url || ""; $("f_enabled").checked = !!it.enabled;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  $("formTitle").textContent = "เพิ่มรายการ";
  $("f_item_id").value = ""; $("f_name").value = ""; $("f_price").value = 0;
  $("f_amount").value = 0; $("f_image").value = ""; $("f_enabled").checked = true;
}

async function saveItem() {
  $("saveErr").textContent = "";
  const body = {
    item_id: $("f_item_id").value, name: $("f_name").value.trim(),
    price: $("f_price").value, amount: $("f_amount").value,
    image_url: $("f_image").value.trim(), enabled: $("f_enabled").checked,
  };
  if (!body.item_id || !body.name) { $("saveErr").textContent = "ต้องมี Item ID และ ชื่อ"; return; }
  try {
    await api("/api/items", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    resetForm(); loadItems();
  } catch (e) { $("saveErr").textContent = e.message; }
}

async function delItem(id) {
  if (!confirm("ลบ item " + id + " ?")) return;
  await api("/api/items/" + id, { method: "DELETE" }).catch((e) => alert(e.message));
  loadItems();
}
</script>
</body>
</html>
